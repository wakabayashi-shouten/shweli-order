<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shwe Li 様 ご注文 / အော်ဒါ</title><style>
*{box-sizing:border-box}html,body,button{touch-action:manipulation}body{margin:0;font-family:"Hiragino Sans","Meiryo","Myanmar Text","Noto Sans Myanmar",sans-serif;background:#f4f6f8;color:#222}
header{background:#16365f;color:#fff;padding:12px 16px}h1{font-size:19px;margin:0}.mm{font-size:.85em;opacity:.9}
main{padding:12px 12px 120px;max-width:560px;margin:0 auto}.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.lab{font-weight:bold;font-size:15px;margin-bottom:6px}.days{display:flex;flex-wrap:wrap;gap:6px}
.days button{font:inherit;font-size:15px;padding:8px 12px;border-radius:9px;border:2px solid #2d5891;background:#fff;color:#16365f}
.days button.on{background:#2d5891;color:#fff}
.it{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #eef1f4}.it:last-child{border-bottom:0}
.nm{flex:1;min-width:0}.nm b{font-size:16px}.nm .mm{display:block;color:#555;font-size:14px}.nm small{color:#888}
.q{display:flex;align-items:center;gap:6px}.q button{width:42px;height:42px;font-size:22px;border-radius:10px;border:0;background:#e3ebf5;color:#16365f}
.q span{min-width:28px;text-align:center;font-size:20px;font-weight:bold}.it.has{background:#fff8e1}
textarea{width:100%;font:inherit;font-size:15px;border:1px solid #c9d1da;border-radius:8px;padding:8px;min-height:60px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 8px rgba(0,0,0,.12)}
.bar button{width:100%;font:inherit;font-size:18px;font-weight:bold;padding:14px;border:0;border-radius:12px;background:#06c755;color:#fff}
.bar button:disabled{background:#bbb}.sum{text-align:center;font-size:13px;color:#555;margin-bottom:6px}
.it{gap:6px}.u{font-size:13px;font-weight:bold;color:#16365f;background:#e3ebf5;border-radius:8px;padding:4px 8px;white-space:nowrap}</style></head><body>
<header><h1>Shwe Li 様　ご注文 <span class="mm">အော်ဒါ</span></h1><div class="mm">株式会社若林商店 03-3681-0217</div></header>
<main>
<div class="card"><div class="lab">納品日 <span class="mm">ပို့ဆောင်ရမည့်နေ့</span></div><div class="days" id="days"></div></div>
<div class="card" id="items"></div>
<div class="card"><div class="lab">ひとこと <span class="mm">မှတ်ချက်</span></div><textarea id="note"></textarea></div>
</main>
<div class="bar"><div class="sum" id="sum">数を入れてください / အရေအတွက် ထည့်ပါ</div><button id="send" disabled>LINE で送る / LINE ဖြင့် ပို့မည်</button></div>
<script>
const ITEMS=[
["/b050","豚ひき","ခြစ်ထားသောဝက်သား","1kg袋"],["b12","豚背骨","ဝက်သားကျောရိုး","10kg 冷凍"],["/b010","豚こま","ဝက်သားပါးပါးလှီး","3kg パック"],
["b7","豚ウデ／モモ","ဝက်သားပေါင်သား","1kg パック"],["/b090","豚バラ皮つき","အရေခွံနဲ့ ဝက်သား","ケース"],["c110","鶏モモひき","ကြက်ကြိတ်သား","3kg パック"],
["/c010","鶏ムネ","ကြက်ရင်အုံ","12kg 箱"],["/c030","鶏モモ（ブラジル）","ကြက်ပေါင်","12kg 箱"],["b0011","豚ガツ","ဝက်အစာအိမ်","10kg 箱"],
["b0024","豚レバー","ဝက်အသဲ / အသည်း","10kg 箱"],["c330","鶏テバサキ","ကြက်တောင်ပံ","12kg 箱"],["c840","鶏ボンジリ","ကြက်ဆီဖုံး","12kg 箱"],
["b11","豚肉付ナンコツ","ဝက်အရိုးနု (အသားပါ)","ケース"]];
const WD="日月火水木金土",q={};let day="";
const d0=new Date();const dl=[];for(let i=1;dl.length<4&&i<20;i++){const d=new Date(d0);d.setDate(d0.getDate()+i);if(d.getDay()===2||d.getDay()===5)dl.push(d);}
const fmt=d=>(d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")";
document.getElementById("days").innerHTML=dl.map((d,i)=>`<button data-d="${fmt(d)}">${fmt(d)}</button>`).join("");
document.querySelectorAll("#days button").forEach(b=>b.onclick=()=>{day=b.dataset.d;document.querySelectorAll("#days button").forEach(x=>x.classList.toggle("on",x===b));upd();});
document.getElementById("items").innerHTML=ITEMS.map((x,i)=>`<div class="it" id="r${i}"><div class="nm"><b>${x[1]}</b><span class="mm">${x[2]}</span></div><span class="u">${x[3]}</span><div class="q"><button data-i="${i}" data-d="-1">−</button><span id="q${i}">0</span><button data-i="${i}" data-d="1">＋</button></div></div>`).join("");
document.getElementById("items").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i;q[i]=Math.max(0,(q[i]||0)+(+b.dataset.d));document.getElementById("q"+i).textContent=q[i];document.getElementById("r"+i).classList.toggle("has",q[i]>0);upd();});
function text(){const L=ITEMS.map((x,i)=>q[i]?`・${x[1]}（${x[3]}）× ${q[i]}`:null).filter(Boolean);const n=document.getElementById("note").value.trim();
 return `【Shwe Li 注文】\n納品日：${day}\n${L.join("\n")}${n?"\nひとこと："+n:""}`;}
function upd(){const n=Object.values(q).filter(v=>v>0).length;const s=document.getElementById("send");s.disabled=!(n&&day);
 document.getElementById("sum").textContent=!day?"納品日を選んでください / နေ့ရွေးပါ":n?`${day}　${n}品 / ${n} မျိုး`:"数を入れてください / အရေအတွက် ထည့်ပါ";}
document.getElementById("send").onclick=()=>{location.href="https://line.me/R/share?text="+encodeURIComponent(text());};
</script></body></html>
